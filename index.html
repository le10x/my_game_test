<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Laberinto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game-screen {
            position: relative;
            background-color: #2b2b2b;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Casillas del tablero */
        .board-tile {
            position: absolute;
            background-color: #383838;
            border: 1px solid #444;
        }

        /* Jugador */
        #player {
            position: absolute;
            background-color: #3498db;
            border-radius: 8px;
            z-index: 10;
            transition: all 0.1s ease-in-out;
        }

        /* Bloque sólido (#) */
        .solid-block {
            position: absolute;
            background-color: #7f8c8d;
            border: 2px solid #95a5a6;
            z-index: 5;
        }

        /* Trampa (X) */
        .trap-hazard {
            position: absolute;
            background-color: #e74c3c;
            border-radius: 50%;
            transform: scale(0.6);
            z-index: 5;
        }

        /* Meta (G) */
        #goal {
            position: absolute;
            background-color: #f1c40f;
            border-radius: 4px;
            transform: scale(0.8);
            z-index: 5;
        }

        /* Paredes delgadas (U, D, L, R) */
        .wall-thin {
            position: absolute;
            z-index: 8;
            pointer-events: none;
        }

        .wall-U { border-top: 5px solid #ffffff; }
        .wall-D { border-bottom: 5px solid #ffffff; }
        .wall-L { border-left: 5px solid #ffffff; }
        .wall-R { border-right: 5px solid #ffffff; }
    </style>
</head>
<body>

    <div id="game-screen"></div>

    <!-- Scripts de los niveles y lógica del juego -->
    <script src="levels/level1.js?v=32"></script>
    <script src="game.js?v=32"></script>
</body>
</html>
