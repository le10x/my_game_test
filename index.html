<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
        background-image: url('resources/Background.png');
        background-size: cover;
        background-position: center;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column; /* Alinea todo verticalmente */
        align-items: center;
        overflow: hidden;
    }
    #board-container {
        flex-grow: 1; /* El tablero tomará todo el espacio restante */
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        overflow: hidden;
    }
    #game-board {
        position: relative;
        transform-origin: center center;
    }
    .tile, .layer-item {
        position: absolute;
        width: 128px;
        height: 128px;
        background-size: contain;
    }
    #controls {
        display: grid;
        grid-template-columns: repeat(3, 80px);
        grid-template-rows: repeat(2, 80px);
        gap: 15px;
        padding-bottom: 20px;
        flex-shrink: 0; /* Asegura que los controles nunca se reduzcan */
    }
    .btn {
        width: 80px; height: 80px;
        background-image: url('resources/Button.png');
        background-size: contain;
        border: none; background-color: transparent;
    }
    /* Rotaciones */
    #btn-up { grid-column: 3; grid-row: 1; transform: rotate(270deg); }
    #btn-left { grid-column: 1; grid-row: 2; transform: rotate(180deg); }
    #btn-right { grid-column: 2; grid-row: 2; transform: rotate(0deg); }
    #btn-down { grid-column: 3; grid-row: 2; transform: rotate(90deg); }
</style>
